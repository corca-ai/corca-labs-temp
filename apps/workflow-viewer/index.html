<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    >
    <meta
      id="page-description"
      name="description"
      content="로컬 Mermaid 워크플로를 미리 보고 PDF로 저장하세요."
    >
    <title>워크플로 뷰어</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./src/styles.css">
  </head>
  <body>
    <header class="toolbar">
      <div class="identity">
        <h1 id="document-title">워크플로 뷰어</h1>
      </div>

      <div id="language-switch" class="language-switch" role="group" aria-label="언어 선택">
        <button class="language-option" type="button" data-language="ko" aria-pressed="true">
          한국어
        </button>
        <button class="language-option" type="button" data-language="en" aria-pressed="false">
          English
        </button>
      </div>

      <div class="actions">
        <button id="open-button" class="button button-primary" type="button" disabled>
          워크플로 열기
        </button>
        <button id="refresh-button" class="button" type="button" hidden>
          새로고침
        </button>
        <button id="print-button" class="button" type="button" disabled>
          인쇄 / PDF 저장
        </button>
      </div>

      <input
        id="file-input"
        class="visually-hidden"
        type="file"
        accept=".md,text/markdown,text/plain"
        aria-label="워크플로 Markdown 파일 선택"
      >
    </header>

    <main id="drop-zone" class="workspace">
      <section id="welcome-panel" class="welcome-panel" aria-labelledby="welcome-title">
        <div class="file-mark" aria-hidden="true">.md</div>
        <div>
          <h2 id="welcome-title">워크플로를 열어 주세요</h2>
          <p>
            <strong id="welcome-action">워크플로 열기</strong><span id="welcome-instruction">를 선택하거나 Mermaid 워크플로 Markdown 파일을 여기에 끌어다 놓으세요.</span>
          </p>
          <p id="privacy-note" class="privacy-note">
            워크플로 파일은 브라우저 안에만 머물며 업로드되지 않습니다.
          </p>
        </div>
      </section>

      <section id="viewer-panel" class="viewer-panel" hidden aria-label="렌더링된 워크플로">
        <div class="file-status">
          <div class="file-details">
            <span id="filename" class="filename"></span>
            <span id="status" class="status" role="status" aria-live="polite"></span>
          </div>
          <span id="local-badge" class="local-badge">로컬 전용</span>
        </div>
        <div id="diagram" class="diagram" aria-label="Workflow diagram"></div>
      </section>

      <section id="error-panel" class="error-panel" hidden role="alert">
        <span id="error-label" class="error-label">워크플로를 표시할 수 없습니다</span>
        <h2 id="error-title">파일을 확인하고 다시 시도해 주세요</h2>
        <pre id="error-detail"></pre>
        <p id="error-guidance"></p>
      </section>
    </main>

    <style id="print-page-style">
      @page { size: A4 landscape; margin: 10mm; }
    </style>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
