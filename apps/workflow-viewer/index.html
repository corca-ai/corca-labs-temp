<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    >
    <meta
      id="page-description"
      name="description"
      content="로컬 Mermaid 워크플로를 미리 보고 PDF로 저장하세요."
    >
    <title>워크플로 뷰어</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./src/styles.css">
  </head>
  <body>
    <header class="toolbar">
      <div class="identity">
        <h1 id="document-title">워크플로 뷰어</h1>
      </div>

      <div id="language-switch" class="language-switch" role="group" aria-label="언어 선택">
        <button class="language-option" type="button" data-language="ko" aria-pressed="true">
          한국어
        </button>
        <button class="language-option" type="button" data-language="en" aria-pressed="false">
          English
        </button>
      </div>

      <div class="actions">
        <button id="print-button" class="button" type="button" disabled>
          인쇄 / PDF 저장
        </button>
      </div>

      <input
        id="file-input"
        class="visually-hidden"
        type="file"
        accept=".md,text/markdown,text/plain"
        aria-label="워크플로 Markdown 파일 선택"
      >
    </header>

    <main id="drop-zone" class="workspace">
      <section class="editor-panel pane" aria-labelledby="editor-title">
        <div class="pane-header">
          <div>
            <h2 id="editor-title">Markdown 편집기</h2>
            <span id="editor-note" class="pane-note">입력하는 동안 미리보기가 자동으로 업데이트됩니다.</span>
          </div>
          <div class="editor-actions">
            <span id="url-badge" class="url-badge">URL 동기화</span>
            <button id="open-button" class="button button-primary" type="button" disabled>
              MD 파일 불러오기
            </button>
            <button id="refresh-button" class="button" type="button" hidden>
              새로고침
            </button>
          </div>
        </div>
        <div
          id="editor"
          class="editor-host"
          aria-label="Mermaid를 지원하는 Markdown 문서"
        ></div>
        <p id="privacy-note" class="privacy-note">
          로컬 파일은 업로드되지 않습니다. 공유 링크의 내용은 URL 조각에만 저장됩니다.
        </p>
      </section>

      <section id="viewer-panel" class="viewer-panel pane" aria-labelledby="preview-title">
        <div class="pane-header preview-header">
          <div class="file-details">
            <h2 id="preview-title">미리보기</h2>
            <span id="filename" class="filename"></span>
            <span id="status" class="status" role="status" aria-live="polite"></span>
          </div>
          <span id="local-badge" class="local-badge">브라우저 전용</span>
        </div>
        <div class="preview-stage">
          <article id="preview" class="markdown-preview" aria-label="Markdown 미리보기"></article>
          <section id="error-panel" class="error-panel" hidden role="alert">
            <span id="error-label" class="error-label">워크플로를 표시할 수 없습니다</span>
            <h3 id="error-title">Mermaid 코드를 확인해 주세요</h3>
            <pre id="error-detail"></pre>
            <p id="error-guidance"></p>
          </section>
        </div>
      </section>

      <div id="drop-overlay" class="drop-overlay" aria-hidden="true">
        <strong id="drop-title">Markdown 파일 놓기</strong>
        <span id="drop-note">파일에서 Mermaid 코드를 불러옵니다.</span>
      </div>
    </main>

    <style id="print-page-style">
      @page { size: A4 landscape; margin: 10mm; }
    </style>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
